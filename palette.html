<!DOCTYPE html>

  <title>Palette — Stills Feed Reference</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0B0B;
      color: #fff;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      padding: 40px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    p.sub {
      color: #9A9A9A;
      font-size: 0.8rem;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .tile {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: #161616;
      border-radius: 4px;
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile__num {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 3px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
